  const steps = [
    ...seq.done.map(d => `<button type="button" class="ag-seq-step is-done" data-rewind="${d.index}" title="Torna a questa linea"><small>✓ Superata</small><strong>${escapeHtml(d.title)}</strong></button>`),
    ...(seq.current ? [`<div class="ag-seq-step is-current" aria-current="step"><small>Sei qui</small><strong>${escapeHtml(seq.current.title)}</strong></div>`] : []),
    ...seq.upcoming.map(level => `<div class="ag-seq-step is-next"><small>${level.length > 1 ? "Possibile · a seconda del caso" : "Possibile"}</small>${level.map(t => `<strong>${escapeHtml(t)}</strong>`).join('<span class="ag-seq-or">oppure</span>')}</div>`),
  ];
  return `<nav class="ag-seq" aria-label="Sequenza terapeutica"><div class="ag-seq-title">Sequenza<br>terapeutica</div>${steps.join(arrow)}</nav>`;
}

function agTrailHtml(data, history, node) {
  const steps = AlgoCore.trail(data, history);
  const now = node.type === "question" ? (node.short || node.text) : node.title;
  const items = steps.map((s, n) => s.kind === "line" ? `
      <li class="is-line"><span class="ag-dot" aria-hidden="true">℞</span>
        <button type="button" data-rewind="${s.index}" title="Torna a questa linea di terapia">
          <span class="ag-t-edit">modifica</span>
          <span class="ag-t-label">Linea superata</span>
          <span class="ag-t-value">${escapeHtml(s.label)}</span>
          <span class="ag-t-sub">${s.options.map(escapeHtml).join(" · ")}</span>
        </button></li>` : `
      <li><span class="ag-dot" aria-hidden="true">${n + 1}</span>
        <button type="button" data-rewind="${s.index}" title="Torna a questa domanda">
          <span class="ag-t-edit">modifica</span>
          <span class="ag-t-label">${escapeHtml(s.label)}</span>
          <span class="ag-t-value">${escapeHtml(s.value)}</span>
        </button></li>`).join("");
  return `
    <div class="ag-panel">
      <h2>Il tuo percorso</h2>
      ${steps.length ? "" : `<p class="ag-trail-empty">Le scelte che fai compariranno qui, in ordine.</p>`}
      <ol class="ag-trail">
        ${items}
        <li class="is-now"><span class="ag-dot" aria-hidden="true">●</span>
          <button type="button" disabled><span class="ag-t-label">Adesso</span><span class="ag-t-value">${escapeHtml(now)}</span></button></li>
      </ol>
      ${steps.length ? `<p class="ag-trail-hint">Clicca un passaggio per tornarci e cambiare risposta.</p>` : ""}
    </div>`;
}

function agContextHtml(data, history, node, nodeId, scheda) {
  const panels = [];
  if (node.type === "question" && node.info) {
    panels.push(`<div class="ag-panel"><h2>Chiarimento</h2><p class="ag-info-text">${escapeHtml(node.info)}</p></div>`);
  }
  if (node.type === "question") {
    const recs = AlgoCore.reachable(data, nodeId);
    const shown = recs.slice(0, 6);
    panels.push(`
      <div class="ag-panel"><h2>Terapie raggiungibili da qui</h2>
        <ul class="ag-reach">
          ${shown.map(id => { const r = data.nodes[id]; return `<li><b>${escapeHtml(r.title)}</b>${r.options.map(o => escapeHtml(o.name)).join(" · ")}</li>`; }).join("")}
        </ul>
        ${recs.length > shown.length ? `<div class="ag-more">e altre ${recs.length - shown.length} raccomandazioni lungo i rami successivi.</div>` : ""}
      </div>`);
  }
  panels.push(`
    <div class="ag-panel"><h2>Legenda</h2>
      <ul class="ag-legend">
        <li><span class="ag-chip ag-aifa-reimbursed">${AlgoCore.aifaLabel("reimbursed")}</span> farmaco con rimborso SSN per questa indicazione</li>
        <li><span class="ag-chip ag-aifa-not_reimbursed">${AlgoCore.aifaLabel("not_reimbursed")}</span> approvato altrove, non prescrivibile SSN</li>
        <li><span class="ag-chip ag-aifa-standard">${AlgoCore.aifaLabel("standard")}</span> trattamento consolidato</li>
        <li><span class="ag-chip ag-aifa-unknown">${AlgoCore.aifaLabel("unknown")}</span> stato regolatorio incerto</li>
      </ul>
    </div>`);
  const rimb = state.items.find(i => i.relative_path === RIMBORSABILITA_PATH);
  panels.push(`
    <div class="ag-panel"><h2>Approfondisci</h2>
      <div class="ag-links">
        ${scheda ? `<button type="button" class="ag-link" data-open-path="__scheda__">Scheda ${escapeHtml(data.title)} ${ICONS.arrowRight}</button>` : ""}
        ${rimb ? `<button type="button" class="ag-link" data-open-path="${RIMBORSABILITA_PATH}">Rimborsabilità e schemi ${ICONS.arrowRight}</button>` : ""}
      </div>
    </div>`);
  return panels.join("");
}

function renderAlgorithm() {
  const { summary, data } = state.activeAlgorithm;
  const history = state.algoHistory;
  const nodeId = AlgoCore.currentNodeId(data, history);
  const node = data.nodes[nodeId];
  const scheda = state.items.find(i => i.relative_path === summary.scheda);
  const content = document.getElementById("content");
  setReaderMode(true);
  const questionNumber = history.filter(s => s.choice !== "next").length + 1;

  const stepHtml = node.type === "question" ? `
    <div class="ag-card ag-q">
      <div class="ag-kicker">Domanda ${questionNumber}</div>
      <h2 class="ag-q-text">${escapeHtml(node.text)}</h2>
      <div class="ag-answers">
        ${node.answers.map((a, i) => {
          const dest = AlgoCore.preview(data, a.next);
          const destHtml = dest.kind === "recommendation"
            ? `<span class="ag-a-dest is-therapy">→ <b>Terapia · ${escapeHtml(dest.label)}</b></span>`
            : `<span class="ag-a-dest">→ poi: <b>${escapeHtml(dest.label)}</b></span>`;
          return `<button type="button" class="ag-answer" data-answer="${i}"><span class="ag-a-label">${escapeHtml(a.label)}</span>${destHtml}</button>`;
        }).join("")}
      </div>
    </div>` : `
    <div class="ag-card ag-rec">
      <div class="ag-kicker">Raccomandazione</div>
      <h2 class="ag-rec-title">${escapeHtml(node.title)}</h2>
      <div class="ag-options">
        ${node.options.map(o => `
          <article class="ag-option ag-aifa-${escapeHtml(o.aifa)}">
            <div class="ag-opt-head">
              <div class="ag-opt-name">${escapeHtml(o.name)}</div>
              <span class="ag-chip ag-aifa-${escapeHtml(o.aifa)}">${escapeHtml(AlgoCore.aifaLabel(o.aifa))}</span>
            </div>
            <div class="ag-opt-key">${escapeHtml(o.key)}</div>
            ${o.detail ? `<div class="ag-opt-detail">${escapeHtml(o.detail)}</div>` : ""}
            ${agRegimenHtml(o.regimen)}
          </article>
        `).join("")}
      </div>
      ${node.note ? `<div class="ag-note">${escapeHtml(node.note)}</div>` : ""}
      <div class="ag-next-wrap">
        ${node.next
          ? `<span class="ag-next-hint">Passo successivo della sequenza:</span><button type="button" class="ag-next" data-proceed>${escapeHtml(node.next.label)} ${ICONS.arrowRight}</button>`
          : `<span class="ag-end">Fine del percorso per questo ramo.</span>`}
      </div>
    </div>`;

  content.innerHTML = `
    <div class="ag">
      <header class="ag-top">
        <div><div class="ag-eyebrow">Algoritmo guidato</div><h1>${escapeHtml(data.title)}</h1></div>
        <div class="ag-top-actions">
          ${history.length ? `<button type="button" class="ag-restart" data-restart>↺ Ricomincia</button>` : ""}
          ${scheda ? `<button type="button" class="ag-link" data-open-path="__scheda__">Vai alla scheda ${ICONS.arrowRight}</button>` : ""}
        </div>
      </header>
      ${agSequenceHtml(AlgoCore.sequence(data, history))}
      <div class="ag-grid">
        <aside class="ag-side ag-trail-wrap">${agTrailHtml(data, history, node)}</aside>
        <section class="ag-main">${stepHtml}</section>
        <aside class="ag-side ag-context">${agContextHtml(data, history, node, nodeId, scheda)}</aside>
      </div>
    </div>
  `;

  content.querySelectorAll("[data-answer]").forEach(b => {
    b.addEventListener("click", () => stepAlgorithm(AlgoCore.choose(data, state.algoHistory, Number(b.dataset.answer))));
  });
  content.querySelectorAll("[data-rewind]").forEach(b => {
    b.addEventListener("click", () => stepAlgorithm(AlgoCore.rewind(state.algoHistory, Number(b.dataset.rewind))));
  });
  content.querySelector("[data-proceed]")?.addEventListener("click", () => stepAlgorithm(AlgoCore.proceed(data, state.algoHistory)));
  content.querySelector("[data-restart]")?.addEventListener("click", () => stepAlgorithm([]));
  content.querySelectorAll("[data-open-path]").forEach(b => {
    b.addEventListener("click", () => {
      const path = b.dataset.openPath === "__scheda__" ? summary.scheda : b.dataset.openPath;
      const item = state.items.find(i => i.relative_path === path);
      if (item) openScheda(item);
    });
  });
}


function renderView() {
  updateNavActive();
  if (state.view === "home") { renderHome(); return; }
  if (state.view === "theme") { renderThemeOverview(state.activeTheme); return; }
  if (state.view === "scheda" && state.activeItem) { openScheda(state.activeItem); return; }
  if (state.view === "algorithms") { renderAlgorithmsList(); return; }
  if (state.view === "algorithm" && state.activeAlgorithm) { renderAlgorithm(); return; }
  renderHome();
}

/* ---------- command palette ---------- */
function cpSearch(q) {
  const query = q.trim().toLowerCase();
  if (!query) return state.items.slice(0, 40);
  return state.items.filter(i =>
    i.title.toLowerCase().includes(query) ||
    i.name.toLowerCase().includes(query) ||
    (i.theme || "").toLowerCase().includes(query) ||
    (i.preview || "").toLowerCase().includes(query) ||
    i.category.toLowerCase().includes(query)
  ).slice(0, 40);
}

function renderCpResults() {
  const box = document.getElementById("cpResults");
  state.cpList = cpSearch(state.query);
  if (!state.cpList.length) {
    box.innerHTML = `<div class="cp-empty">Nessun risultato per "${escapeHtml(state.query)}"</div>`;
    return;
  }
  box.innerHTML = state.cpList.map((item, idx) => `
    <div class="cp-item ${idx === state.cpIndex ? 'active' : ''}" data-idx="${idx}">
      ${themeBadge(item.theme || 'Altro', 28)}
      <div class="cp-item-text">
        <div class="cp-item-title">${escapeHtml(item.title)}</div>
        <div class="cp-item-sub">${escapeHtml(item.category)} · ${escapeHtml(item.theme || 'Altro')}</div>
      </div>
    </div>
  `).join("");
  box.querySelectorAll(".cp-item").forEach(el => {
    el.addEventListener("click", () => cpOpen(parseInt(el.dataset.idx)));
    el.addEventListener("mouseenter", () => { state.cpIndex = parseInt(el.dataset.idx); renderCpResults(); });
  });
}

function cpOpen(idx) {
  const item = state.cpList[idx];
  if (!item) return;
  closeCommandPalette();
  if (item.extension === ".md") openScheda(item);
  else goToTheme(item.theme);
}

function openCommandPalette() {
  const overlay = document.getElementById("cpOverlay");
  overlay.classList.add("open");
  state.query = "";
  state.cpIndex = 0;
  document.getElementById("cpInput").value = "";
  renderCpResults();
  setTimeout(() => document.getElementById("cpInput").focus(), 30);
}
function closeCommandPalette() {
  document.getElementById("cpOverlay").classList.remove("open");
}

document.getElementById("searchTrigger").addEventListener("click", openCommandPalette);
document.getElementById("cpOverlay").addEventListener("click", (e) => {
  if (e.target.id === "cpOverlay") closeCommandPalette();
});
document.getElementById("cpInput").addEventListener("input", (e) => {
  state.query = e.target.value;
  state.cpIndex = 0;
  renderCpResults();
});
document.getElementById("cpInput").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); state.cpIndex = Math.min(state.cpIndex + 1, state.cpList.length - 1); renderCpResults(); }
  if (e.key === "ArrowUp") { e.preventDefault(); state.cpIndex = Math.max(state.cpIndex - 1, 0); renderCpResults(); }
  if (e.key === "Enter") { e.preventDefault(); cpOpen(state.cpIndex); }
  if (e.key === "Escape") { closeCommandPalette(); }
});

document.addEventListener("keydown", (e) => {
  const overlayOpen = document.getElementById("cpOverlay").classList.contains("open");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    overlayOpen ? closeCommandPalette() : openCommandPalette();
    return;
  }
  if (e.key === "/" && !overlayOpen && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    openCommandPalette();
    return;
  }
  if (e.key === "Escape" && overlayOpen) closeCommandPalette();
});

document.getElementById("navHome").addEventListener("click", goHome);
document.getElementById("navAlgorithms").addEventListener("click", goToAlgorithms);
document.getElementById("printBtn").addEventListener("click", () => window.print());
window.addEventListener("scroll", updateReadingProgress, { passive: true });

const backToTopBtn = document.getElementById("backToTop");
window.addEventListener("scroll", () => {
  backToTopBtn.classList.toggle("visible", window.scrollY > 500);
}, { passive: true });
backToTopBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

initTheme();
initSidebarCollapse();
initMobileNav();
initMermaid();
loadData();
</script>
</body>
</html>
