<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oncologia Medica</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=fraunces@500,600,600i&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"] {
  --color-bg: #f6f3ec;
  --color-surface: #fbfaf6;
  --color-surface-2: #ffffff;
  --color-surface-offset: #efeae1;
  --color-border: #ddd6ca;
  --color-divider: #e6e0d5;
  --color-text: #241f18;
  --color-text-muted: #6f6a60;
  --color-text-faint: #a8a196;
  --color-text-inverse: #fbfaf6;
  --color-primary: #0f6f68;
  --color-primary-hover: #0b5751;
  --color-primary-active: #083f3b;
  --color-primary-highlight: #d7ece7;
  --color-primary-soft: #eaf5f3;
  --color-accent: #c4622d;
  --color-accent-highlight: #f6e3d4;
  --color-warn: #b5892b;
  --color-warn-highlight: #f3e6c8;
  --color-key: #3a6ea5;
  --color-key-soft: #eaf0f7;
  --color-key-border: #c4d5e6;
  --color-mark: #fbe7a1;
  --color-danger: #b0402e;
  --color-danger-soft: #fbece8;
  --color-danger-border: #ebc4bb;
  --read-measure: 740px;
  --note-gap: 34px;
  --shadow-sm: 0 1px 2px rgba(40,35,25,0.06);
  --shadow-md: 0 6px 20px rgba(40,35,25,0.08);
  --shadow-lg: 0 20px 50px rgba(40,35,25,0.14);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'General Sans', -apple-system, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --flow-criteria-bg: #eaf5ec;
  --flow-criteria-border: #3f8a5c;
  --flow-criteria-text: #1e5334;
  --flow-criteria-strip: #dcefe0;
  --flow-badge-green: #2e9e5b;
  --flow-badge-red: #c0392b;
  --flow-badge-grey: #9a9284;
}
[data-theme="dark"] {
  --color-bg: #14120f;
  --color-surface: #1a1814;
  --color-surface-2: #1f1c17;
  --color-surface-offset: #24211b;
  --color-border: #343026;
  --color-divider: #2a2620;
  --color-text: #ede8dc;
  --color-text-muted: #a39b8a;
  --color-text-faint: #6e6858;
  --color-text-inverse: #14120f;
  --color-primary: #52b6ab;
  --color-primary-hover: #6cc8bd;
  --color-primary-active: #86d5cb;
  --color-primary-highlight: #1e3733;
  --color-primary-soft: #1a2e2a;
  --color-accent: #e08a52;
  --color-accent-highlight: #3a2a1c;
  --color-warn: #d9ac52;
  --color-warn-highlight: #382e18;
  --color-key: #7fb0e0;
  --color-key-soft: #182734;
  --color-key-border: #2c435a;
  --color-mark: #5a4a17;
  --color-danger: #ec8a76;
  --color-danger-soft: #2c1b17;
  --color-danger-border: #54302a;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 6px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.55);
  --flow-criteria-bg: #17281d;
  --flow-criteria-border: #4bab74;
  --flow-criteria-text: #bfe8cf;
  --flow-criteria-strip: #1f3527;
  --flow-badge-green: #52c785;
  --flow-badge-red: #e0685a;
  --flow-badge-grey: #a39b8a;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}
a { color: inherit; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--color-primary-highlight); color: var(--color-primary-active); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 999px; border: 2px solid var(--color-bg); }
::-webkit-scrollbar-track { background: transparent; }

.app {
  display: grid;
  grid-template-columns: 264px 1fr;
  min-height: 100vh;
  transition: grid-template-columns 0.2s ease;
}
.app.sidebar-collapsed { grid-template-columns: 60px 1fr; }

/* READING PROGRESS BAR */
.reading-progress {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
  width: 0%; z-index: 60; transition: width 0.1s linear;
}

/* SIDEBAR */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-surface);
  padding: 22px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar-collapse-btn {
  border: 1px solid var(--color-border);
  background: var(--color-surface-2);
  border-radius: 9px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted);
  flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
.sidebar-collapse-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
.sidebar-collapse-btn svg { width: 15px; height: 15px; transition: transform 0.2s ease; }
.app.sidebar-collapsed .sidebar-collapse-btn svg { transform: rotate(180deg); }

.sidebar.collapsed { padding: 22px 10px 14px; align-items: center; }
.sidebar.collapsed .brand { flex-direction: column; gap: 10px; }
.sidebar.collapsed .brand-text,
.sidebar.collapsed .st-label,
.sidebar.collapsed .kbd-hint,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .theme-list,
.sidebar.collapsed .nav-all span,
.sidebar.collapsed .sidebar-footer span { display: none; }
.sidebar.collapsed .search-trigger { justify-content: center; padding: 9px; width: 32px; }
.sidebar.collapsed .nav-all { justify-content: center; padding: 9px; }
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-active));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
.brand-mark svg { width: 19px; height: 19px; color: var(--color-text-inverse); }
.brand-text { flex: 1; min-width: 0; }
.brand-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.15;
}
.brand-sub { font-size: 0.72rem; color: var(--color-text-muted); }
.theme-toggle {
  border: 1px solid var(--color-border);
  background: var(--color-surface-2);
  border-radius: 10px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted);
  flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s, transform 0.15s;
}
.theme-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); transform: translateY(-1px); }
.theme-toggle svg { width: 15px; height: 15px; }

.search-trigger {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px;
  border-radius: 11px;
  border: 1px solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text-faint);
  font-size: 0.86rem;
  transition: border-color 0.15s, box-shadow 0.15s;
  width: 100%;
  text-align: left;
}
.search-trigger:hover { border-color: var(--color-primary); }
.search-trigger svg { width: 14px; height: 14px; flex-shrink: 0; }
.search-trigger .st-label { flex: 1; }
.kbd-hint {
  font-size: 0.68rem;
  border: 1px solid var(--color-border);
  border-radius: 5px;
  padding: 1px 5px;
  color: var(--color-text-faint);
  background: var(--color-surface);
  font-family: var(--font-mono);
}


.nav-all {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--color-text-muted);
  transition: background 0.12s, color 0.12s;
}
.nav-all svg { width: 15px; height: 15px; }
.nav-all:hover { background: var(--color-surface-offset); color: var(--color-text); }
.nav-all.active { background: var(--color-primary-highlight); color: var(--color-primary); }

.nav-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-faint);
  margin: 2px 4px 0;
  font-weight: 600;
}

.theme-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; padding-right: 2px; }
.theme-group { border-radius: 11px; }
.theme-header {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 8px;
  border-radius: 10px;
  font-size: 0.87rem;
  font-weight: 500;
  transition: background 0.12s;
}
.theme-header:hover { background: var(--color-surface-offset); }
.theme-header.active-theme { color: var(--color-primary); }
.theme-badge {
  width: 24px; height: 24px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.64rem; font-weight: 700; color: #fff;
  flex-shrink: 0; letter-spacing: 0.01em;
}
.theme-header .th-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-header .count {
  font-size: 0.68rem;
  color: var(--color-text-faint);
  background: var(--color-surface-offset);
  border-radius: 999px;
  padding: 2px 7px;
  flex-shrink: 0;
}
.theme-header .chev {
  width: 12px; height: 12px;
  transition: transform 0.18s ease;
  color: var(--color-text-faint);
  flex-shrink: 0;
}
.theme-header.open .chev { transform: rotate(90deg); }

.scheda-list {
  display: none;
  flex-direction: column;
  padding-left: 33px;
  margin: 2px 0 4px;
  gap: 1px;
}
.scheda-list.open { display: flex; animation: slideDown 0.18s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.scheda-link {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 9px;
  border-radius: 8px;
  font-size: 0.82rem;
  color: var(--color-text-muted);
  border-left: 2px solid transparent;
  transition: background 0.12s, color 0.12s;
}
.scheda-link:hover { background: var(--color-surface-offset); color: var(--color-text); }
.scheda-link.active {
  background: var(--color-primary-highlight);
  color: var(--color-primary);
  font-weight: 600;
  border-left-color: var(--color-primary);
}

.sidebar-footer {
  font-size: 0.7rem;
  color: var(--color-text-faint);
  padding-top: 10px;
  border-top: 1px solid var(--color-divider);
  display: flex; justify-content: space-between; align-items: center;
}

/* MAIN */
.main { min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 36px;
  border-bottom: 1px solid var(--color-divider);
  background: color-mix(in srgb, var(--color-surface) 92%, transparent);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 5;
  gap: 16px;
}
.crumbs { font-size: 0.85rem; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
.crumbs strong { color: var(--color-text); }
.crumbs .sep { color: var(--color-text-faint); }
.topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.stat-pills { display: flex; gap: 8px; }
.pill {
  font-size: 0.76rem;
  color: var(--color-text-muted);
  background: var(--color-surface-offset);
  border-radius: 999px;
  padding: 5px 11px;
  white-space: nowrap;
}
.icon-btn {
  border: 1px solid var(--color-border);
  background: var(--color-surface-2);
  border-radius: 9px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted);
  transition: border-color 0.15s, color 0.15s;
}
.icon-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
.icon-btn svg { width: 15px; height: 15px; }

.content { padding: 36px; max-width: 1180px; animation: fadeIn 0.25s ease; }
.content.is-reader { max-width: none; padding: 36px 40px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* HOME / OVERVIEW */
.overview-hero {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 32px;
  margin-bottom: 32px; flex-wrap: wrap;
}
.overview-hero .eyebrow {
  font-size: 0.76rem;
  color: var(--color-primary);
  background: var(--color-primary-highlight);
  display: inline-block;
  padding: 4px 11px;
  border-radius: 999px;
  margin-bottom: 14px;
  font-weight: 600;
}
.overview-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 3vw, 2.5rem);
  margin: 0 0 10px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.overview-hero p { color: var(--color-text-muted); max-width: 60ch; margin: 0; }
.hero-left { flex: 1; min-width: 260px; }


.theme-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  margin-top: 6px;
}
.theme-card {
  position: relative;
  overflow: hidden;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 16px;
  padding: 20px 18px 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
  display: flex; flex-direction: column; gap: 10px;
}
.theme-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-accent, var(--color-primary)); opacity: 0.85;
}
.theme-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--color-primary); }
.theme-card .tc-head { display: flex; align-items: center; gap: 10px; }
.theme-card .tc-title { font-weight: 600; font-size: 0.98rem; flex: 1; }
.theme-card .tc-count { color: var(--color-text-muted); font-size: 0.8rem; }

.section-title { font-size: 1rem; font-weight: 600; margin: 0 0 14px; font-family: var(--font-display); }
.updated-strip { margin-top: 42px; }
.updated-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.updated-chip {
  min-width: 230px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 14px;
  padding: 14px 15px;
  flex-shrink: 0;
  transition: border-color 0.15s, transform 0.15s;
}
.updated-chip:hover { border-color: var(--color-primary); transform: translateY(-2px); }
.updated-chip .cat { font-size: 0.72rem; color: var(--color-primary); margin-bottom: 5px; font-weight: 600; }
.updated-chip .name { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
.updated-chip .date { font-size: 0.74rem; color: var(--color-text-faint); }


/* READER */
.reader-layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 44px; align-items: start; }
.reader-wrap { min-width: 0; }
.reader-head { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--color-divider); }
.reader-head .badge-theme {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 600;
  color: var(--color-primary);
  background: var(--color-primary-highlight);
  border-radius: 999px;
  padding: 4px 11px;
  margin-bottom: 12px;
}
.reader-head h1 {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 3vw, 2.3rem);
  margin: 0 0 10px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.reader-meta-row { display: flex; flex-wrap: wrap; gap: 14px; color: var(--color-text-faint); font-size: 0.82rem; }
.reader-meta-row span { display: flex; align-items: center; gap: 5px; }
.reader-meta-row svg { width: 13px; height: 13px; }

/* TEMA DI LETTURA "Carta Clinica": colonna di testo contenuta, sezioni numerate, riquadri per tipo,
   riepiloghi finali in evidenza. I colori derivano dai token di :root / [data-theme="dark"]. */
.md-content { font-size: 17px; line-height: 1.75; container-type: inline-size; container-name: scheda; }
/* colonna di testo; tabelle, diagrammi e riepiloghi usano invece tutta la larghezza */
.md-content > :is(p, ul, ol, h3, h4, blockquote, .callout, .np) { max-width: var(--read-measure); }
.md-content h2 {
  font-family: var(--font-display);
  font-size: 1.5em;
  font-weight: 600;
  line-height: 1.25;
  margin: 58px 0 16px;
  padding-top: 22px;
  border-top: 1px solid var(--color-divider);
  scroll-margin-top: 90px;
  letter-spacing: -0.015em;
}
.md-content h2:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.md-content h3 {
  font-size: 1.12em;
  font-weight: 700;
  line-height: 1.35;
  margin: 32px 0 10px;
  padding-left: 12px;
  border-left: 3px solid var(--color-primary);
  color: var(--color-text);
  scroll-margin-top: 90px;
}
.md-content h4 { font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin: 24px 0 8px; color: var(--color-text-muted); }
.md-content p { margin: 0 0 1.05em; }
.md-content ul, .md-content ol { margin: 0 0 1.2em 2px; padding-left: 22px; }
.md-content li { margin-bottom: 8px; padding-left: 3px; }
.md-content li::marker { color: var(--color-primary); }
.md-content hr { border: none; border-top: 1px solid var(--color-divider); margin: 32px 0; }
.md-content strong { color: var(--color-text); font-weight: 700; }
.md-content mark.hl { color: inherit; font-weight: 600; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: 3px; }
/* ==testo== : evidenziatore, il concetto da ricordare */
.md-content mark.hl-primary { background: linear-gradient(transparent 38%, var(--color-mark) 38%); padding: 0 2px; }
/* ++testo++ : novità / aggiornamento */
.md-content mark.hl-accent { background: var(--color-accent-highlight); color: var(--color-accent); padding: 1px 5px; }
/* !!testo!! : attenzione, errore frequente */
.md-content mark.hl-warn { background: var(--color-danger-soft); color: var(--color-danger); padding: 1px 5px; }
.md-content code { background: var(--color-surface-offset); border-radius: 4px; padding: 1px 6px; font-size: 0.87em; font-family: var(--font-mono); }
.md-content pre {
  background: var(--color-surface-offset); border: 1px solid var(--color-border);
  border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 0 0 20px;
}
.md-content pre code { background: none; padding: 0; font-size: 0.83em; line-height: 1.55; white-space: pre; }
.md-content blockquote {
  margin: 0 0 18px; padding: 12px 18px; border-left: 3px solid var(--color-border);
  color: var(--color-text-muted);
}
.md-content blockquote p:last-child { margin-bottom: 0; }

/* Riquadri "> ++Etichetta:++ ..." — l'etichetta diventa intestazione, il colore dice il tipo */
.md-content .callout {
  margin: 20px 0 24px;
  padding: 14px 18px 4px;
  border: 1px solid var(--co-border);
  border-left: 4px solid var(--co-ink);
  border-radius: 12px;
  background: var(--co-bg);
  font-size: 0.95em;
}
.md-content .callout-label {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--co-ink); margin-bottom: 6px;
}
.md-content .callout p { margin-bottom: 10px; }
.md-content .callout-label + p::first-letter { text-transform: uppercase; }
.md-content .co-update { --co-ink: var(--color-accent); --co-bg: var(--color-surface-2); --co-border: var(--color-accent-highlight); }
.md-content .co-warn { --co-ink: var(--color-danger); --co-bg: var(--color-danger-soft); --co-border: var(--color-danger-border); }
.md-content .co-info { --co-ink: var(--color-primary); --co-bg: var(--color-primary-soft); --co-border: var(--color-primary-highlight); }

/* Riepiloghi finali: "Punti chiave" ed "Errori da evitare" */
.md-content .summary-card {
  margin: 58px 0 28px;
  max-width: 1180px;
  padding: 24px 28px 12px;
  border-radius: 16px;
  border: 1px solid var(--sum-border);
  background: var(--sum-bg);
}
.md-content .summary-card + .summary-card { margin-top: 0; }
.md-content .summary-card h2 {
  margin: 0 0 16px; padding: 0; border: none;
  font-size: 1.35em; color: var(--sum-ink);
  display: flex; align-items: center; gap: 10px;
}
.md-content .summary-card h2::before {
  content: ""; width: 10px; height: 10px; border-radius: 3px;
  background: var(--sum-ink); transform: rotate(45deg); flex-shrink: 0;
}
.md-content .summary-card ul { padding-left: 26px; }
.md-content .summary-card li { margin-bottom: 11px; break-inside: avoid; }
.md-content .summary-card li::marker { color: var(--sum-ink); font-weight: 700; }
.md-content .sum-key { --sum-ink: var(--color-key); --sum-bg: var(--color-key-soft); --sum-border: var(--color-key-border); }
.md-content .sum-key li::marker { content: "✓  "; }
.md-content .sum-err { --sum-ink: var(--color-danger); --sum-bg: var(--color-danger-soft); --sum-border: var(--color-danger-border); }
.md-content .sum-err li::marker { content: "✕  "; }
@media (max-width: 640px) {
  .md-content { font-size: 16.5px; }
  .md-content .summary-card { padding: 18px 16px 6px; }
  .md-content .summary-card ul { padding-left: 22px; }
}


/* Nomi di trial in grassetto → etichetta */
.md-content strong.trial {
  font-weight: 650; color: var(--color-key); background: var(--color-key-soft);
  padding: 0 5px; border-radius: 4px; white-space: nowrap;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}

/* Note grafiche a margine: standard di cura, trial chiave, novità AIFA */
.md-content .mnotes { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 18px; }
.md-content .mnote {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-size: 0.74rem; line-height: 1.35;
  padding: 3px 9px; border-radius: 999px;
  color: var(--mn-ink); background: var(--mn-bg); border: 1px solid var(--mn-border);
}
.md-content .mnote-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.92em; white-space: nowrap; }
.md-content .mnote-detail { color: var(--color-text); font-weight: 500; }
.md-content .mn-standard { --mn-ink: var(--color-primary); --mn-bg: var(--color-primary-soft); --mn-border: var(--color-primary-highlight); }
.md-content .mn-new { --mn-ink: var(--color-accent); --mn-bg: var(--color-accent-highlight); --mn-border: var(--color-accent-highlight); }
.md-content .mn-trial { --mn-ink: var(--color-key); --mn-bg: var(--color-key-soft); --mn-border: var(--color-key-border); }
.md-content .mn-aifa { --mn-ink: var(--flow-criteria-border); --mn-bg: var(--flow-criteria-bg); --mn-border: var(--flow-criteria-strip); }
.md-content .mn-gap { --mn-ink: var(--color-warn); --mn-bg: var(--color-warn-highlight); --mn-border: var(--color-warn-highlight); }
@container scheda (min-width: 990px) {
  .md-content .np { position: relative; }
  .md-content .mnotes {
    position: absolute; top: 4px; left: calc(100% + var(--note-gap));
    width: min(270px, calc(100cqw - var(--read-measure) - var(--note-gap)));
    flex-direction: column; gap: 8px; margin: 0;
  }
  .md-content .mnote {
    display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
    border-radius: 0 10px 10px 0; border: none; border-left: 3px solid var(--mn-ink);
    padding: 7px 12px; font-size: 0.76rem;
  }
  .md-content .mnote-detail { font-size: 1.05em; }
  .md-content .summary-card ul { columns: 2; column-gap: 44px; }
}

/* Tabelle: righe più compatte e pulsante per aprirle a schermo intero */
.md-content table { line-height: 1.5; }
.md-content .table-block { position: relative; margin: 0 0 22px; }
.md-content .table-block .table-wrap { margin: 0; }
.table-expand {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 0 8px;
  border: 1px solid var(--color-border); background: var(--color-surface-2); color: var(--color-text-muted);
  border-radius: 8px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600;
}
.table-expand:hover { border-color: var(--color-primary); color: var(--color-primary); }
.table-overlay {
  position: fixed; inset: 0; z-index: 90; background: var(--color-bg);
  display: flex; flex-direction: column; padding: 18px 24px 24px;
}
.table-overlay-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.table-overlay-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.table-overlay .table-wrap { flex: 1; overflow: auto; margin: 0; }
.table-overlay table { font-size: 0.92rem; line-height: 1.5; }
.table-overlay thead th { position: sticky; top: 0; z-index: 1; }

/* Scorciatoia ai punti chiave nell'intestazione della scheda */
.reader-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.kp-jump {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--color-key-border); background: var(--color-key-soft); color: var(--color-key);
  border-radius: 999px; padding: 6px 14px; font-size: 0.82rem; font-weight: 600;
}
.kp-jump:hover { filter: brightness(0.97); }
.kp-jump::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; transform: rotate(45deg); }

.md-content img { max-width: 100%; border-radius: 12px; border: 1px solid var(--color-border); margin: 10px 0 20px; display: block; }
.md-content .mermaid-card {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 14px;
  padding: 22px 20px 16px;
  margin: 6px 0 26px;
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
}
.md-content .mermaid-card .mermaid {
  display: flex;
  justify-content: center;
  min-width: fit-content;
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--color-text-faint);
  white-space: pre;
}
.md-content .mermaid-card svg { max-width: 100%; height: auto; }
.md-content .mermaid-card .edgeLabel { background: var(--color-surface-2) !important; }

.md-content .scheda-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 26px;
  padding: 11px 20px;
  border-radius: 12px;
  background: var(--color-accent);
  color: #fff;
  font-weight: 600;
  font-size: 0.94rem;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: filter 0.15s ease, transform 0.15s ease;
}
.md-content .scheda-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.md-content .scheda-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* SCHEMA POPUP — tooltip a comparsa sul nome di un farmaco/regime, con dettaglio cicli/cadenza */
.md-content .tt-trig {
  cursor: help;
  border-bottom: 1.5px dotted var(--color-key);
  padding-bottom: 1px;
}
.md-content .tt-trig:hover, .md-content .tt-trig:focus-visible, .md-content .tt-trig.tt-open {
  border-bottom-style: solid;
  outline: none;
}
#tt-portal {
  position: fixed;
  z-index: 900;
  width: max-content;
  max-width: 320px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-key-border);
  box-shadow: var(--shadow-lg);
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--color-text);
  opacity: 0;
  visibility: hidden;
  transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease;
  pointer-events: none;
}
#tt-portal.tt-visible { opacity: 1; visibility: visible; transform: translateY(0); }
#tt-portal .tt-portal-label {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--color-key);
  margin-bottom: 4px;
}
@media (max-width: 640px) { #tt-portal { max-width: calc(100vw - 32px); } }


.md-content .table-wrap { overflow-x: auto; margin: 0 0 22px; border: 1px solid var(--color-border); border-radius: 12px; }
.md-content table { border-collapse: collapse; width: 100%; font-size: 0.88em; }
.md-content th, .md-content td { padding: 9px 13px; text-align: left; border-bottom: 1px solid var(--color-divider); vertical-align: top; }
.md-content thead th { background: var(--color-surface-offset); font-weight: 700; }
.md-content tbody tr:last-child td { border-bottom: none; }
.md-content tbody tr:hover { background: var(--color-surface-offset); }

/* TOC */
.toc { position: sticky; top: 90px; }
.toc-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-faint); font-weight: 700; margin-bottom: 10px; }
.toc-list { display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--color-divider); }
.toc-list a {
  display: block; padding: 4px 0 4px 12px; font-size: 0.74rem; line-height: 1.3; color: var(--color-text-muted);
  border-left: 2px solid transparent; margin-left: -2px; transition: color 0.12s, border-color 0.12s;
  text-decoration: none;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.toc-list a:hover { color: var(--color-text); }
.toc-list a.active { color: var(--color-primary); border-left-color: var(--color-primary); font-weight: 600; }

.reader-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--color-divider); }
.reader-nav-btn {
  flex: 1; max-width: 48%;
  border: 1px solid var(--color-border); background: var(--color-surface-2);
  border-radius: 13px; padding: 12px 15px; text-align: left;
  transition: border-color 0.15s, transform 0.15s;
  display: flex; flex-direction: column; gap: 3px;
}
.reader-nav-btn:hover { border-color: var(--color-primary); transform: translateY(-2px); }
.reader-nav-btn.next { text-align: right; margin-left: auto; align-items: flex-end; }
.reader-nav-btn .rn-label { font-size: 0.7rem; color: var(--color-text-faint); display: flex; align-items: center; gap: 4px; }
.reader-nav-btn .rn-title { font-size: 0.86rem; font-weight: 600; }

.related-box { margin-top: 44px; padding-top: 26px; border-top: 1px solid var(--color-divider); }
.related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.related-card { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 14px; padding: 14px; transition: border-color 0.15s; }
.related-card:hover { border-color: var(--color-primary); }
.related-card .rc-cat { font-size: 0.72rem; color: var(--color-text-muted); margin-bottom: 6px; }
.related-card .rc-title { font-size: 0.88rem; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
.related-card a { font-size: 0.82rem; color: var(--color-primary); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

.empty-state { color: var(--color-text-muted); padding: 50px 0; max-width: 60ch; text-align: center; }
.empty-state svg { width: 40px; height: 40px; color: var(--color-text-faint); margin-bottom: 14px; }

/* COMMAND PALETTE */
.cp-overlay {
  position: fixed; inset: 0; background: rgba(20,17,12,0.5); backdrop-filter: blur(2px);
  display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 100;
}
.cp-overlay.open { display: flex; animation: fadeIn 0.15s ease; }
.cp-modal {
  width: 100%; max-width: 560px; background: var(--color-surface-2);
  border: 1px solid var(--color-border); border-radius: 16px; box-shadow: var(--shadow-lg);
  overflow: hidden; max-height: 70vh; display: flex; flex-direction: column;
}
.cp-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--color-divider); }
.cp-input-row svg { width: 16px; height: 16px; color: var(--color-text-faint); flex-shrink: 0; }
.cp-input-row input { flex: 1; border: none; outline: none; background: none; color: var(--color-text); font-size: 0.98rem; font-family: inherit; }
.cp-input-row .kbd-hint { flex-shrink: 0; }
.cp-results { overflow-y: auto; padding: 8px; }
.cp-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 10px; transition: background 0.1s;
}
.cp-item.active, .cp-item:hover { background: var(--color-surface-offset); }
.cp-item .theme-badge { width: 28px; height: 28px; font-size: 0.68rem; }
.cp-item-text { flex: 1; min-width: 0; }
.cp-item-title { font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-item-sub { font-size: 0.74rem; color: var(--color-text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-empty { padding: 30px 16px; text-align: center; color: var(--color-text-faint); font-size: 0.86rem; }

/* ALGORITMI GUIDATI */
.nav-all[hidden] { display: none; }
.nav-count {
  margin-left: auto; font-size: 0.68rem; color: var(--color-text-faint);
  background: var(--color-surface-offset); border-radius: 999px; padding: 2px 7px;
}
.ag { min-width: 0; }
.ag-list-theme { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin: 26px 0 10px; }
.ag-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.ag-eyebrow { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-primary); margin-bottom: 4px; }
.ag-top h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 3vw, 2.3rem); margin: 0; font-weight: 600; line-height: 1.1; }
.ag-top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ag-link, .ag-open-btn, .ag-restart {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--color-border); background: var(--color-surface-2); color: var(--color-primary);
  font-weight: 600; font-size: 0.84rem; border-radius: 10px; padding: 7px 12px;
}
.ag-restart { color: var(--color-text-muted); }
.ag-link svg, .ag-open-btn svg, .ag-restart svg { width: 14px; height: 14px; }
.ag-link:hover, .ag-open-btn:hover, .ag-restart:hover { border-color: var(--color-primary); color: var(--color-primary); }
.ag-open-btn { margin-top: 14px; }
.reader-actions .ag-open-btn { margin-top: 0; }

/* banda della sequenza terapeutica */
.ag-seq {
  align-items: center;
  display: flex; align-items: stretch; gap: 0; overflow-x: auto; margin-bottom: 22px;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px; padding: 12px 14px;
}
.ag-seq-title { flex: none; align-self: center; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-muted); margin-right: 14px; writing-mode: horizontal-tb; }
.ag-seq-step {
  flex: none; display: flex; flex-direction: column; gap: 2px; min-width: 130px;
  border: 1.5px solid var(--color-border); border-radius: 10px; padding: 8px 12px; background: var(--color-surface-2); text-align: left; color: var(--color-text);
}
.ag-seq-step small { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-faint); }
.ag-seq-step strong { font-size: 0.9rem; }
button.ag-seq-step:hover { border-color: var(--color-primary); }
.ag-seq-step.is-done small { color: var(--flow-badge-green); }
.ag-seq-step.is-current { border-color: var(--color-primary); background: var(--color-primary-soft); box-shadow: 0 0 0 3px var(--color-primary-highlight); }
.ag-seq-step.is-current small { color: var(--color-primary); }
.ag-seq-step.is-next { border-style: dashed; background: transparent; color: var(--color-text-muted); }
.ag-seq-arrow { flex: none; align-self: center; display: flex; flex-direction: column; align-items: center; padding: 0 8px; color: var(--color-text-faint); font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.ag-seq-arrow svg { width: 18px; height: 18px; }
.ag-seq-or { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-faint); margin: 1px 0; }

/* griglia a tre colonne */
.ag-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.ag-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px; padding: 16px; }
.ag-panel + .ag-panel { margin-top: 14px; }
.ag-panel h2 { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-muted); margin: 0 0 12px; }
.ag-side { position: sticky; top: 20px; }

/* timeline delle scelte */
.ag-trail { list-style: none; margin: 0; padding: 0; }
.ag-trail li { position: relative; padding-left: 30px; padding-bottom: 12px; }
.ag-trail li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--color-divider); }
.ag-trail li:last-child { padding-bottom: 0; }
.ag-trail li:last-child::before { display: none; }
.ag-dot {
  position: absolute; left: 0; top: 2px; width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700;
  background: var(--color-surface-offset); color: var(--color-text-muted); border: 1.5px solid var(--color-border);
}
.ag-trail .is-line .ag-dot { background: var(--flow-criteria-bg); color: var(--flow-criteria-text); border-color: var(--flow-criteria-border); }
.ag-trail .is-now .ag-dot { background: var(--color-primary); color: var(--color-text-inverse); border-color: var(--color-primary); }
.ag-trail button { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 2px 6px; margin-left: -6px; color: var(--color-text); }
.ag-trail button:hover { border-color: var(--color-border); background: var(--color-surface-2); }
.ag-trail button:hover .ag-t-edit { opacity: 1; }
.ag-t-label { display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-faint); }
.ag-t-value { display: block; font-size: 0.88rem; font-weight: 600; line-height: 1.35; }
.ag-t-sub { display: block; font-size: 0.76rem; color: var(--color-text-muted); line-height: 1.35; margin-top: 2px; }
.ag-t-edit { float: right; opacity: 0; font-size: 0.7rem; color: var(--color-primary); font-weight: 600; transition: opacity 0.12s; }
.ag-trail .is-now .ag-t-label { color: var(--color-primary); }
.ag-trail-empty { font-size: 0.84rem; color: var(--color-text-muted); line-height: 1.5; margin: 0; }
.ag-trail-hint { margin: 12px 0 0; font-size: 0.74rem; color: var(--color-text-faint); }

/* colonna centrale */
.ag-card { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 16px; padding: 24px 26px; box-shadow: var(--shadow-sm); }
.ag-kicker { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-primary); }
.ag-q-text { font-family: var(--font-display); font-size: clamp(1.3rem, 2.2vw, 1.7rem); font-weight: 600; line-height: 1.25; margin: 6px 0 20px; }
.ag-answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ag-answer {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  background: var(--color-surface); border: 1.5px solid var(--color-border); color: var(--color-text);
  border-radius: 12px; padding: 14px 16px; transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
}
.ag-answer:hover { border-color: var(--color-primary); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.ag-a-label { font-weight: 700; font-size: 1rem; }
.ag-a-dest { font-size: 0.78rem; color: var(--color-text-muted); display: flex; gap: 5px; align-items: baseline; }
.ag-a-dest b { color: var(--color-primary); font-weight: 600; }
.ag-a-dest.is-therapy b { color: var(--flow-criteria-border); }
.ag-rec-title { font-family: var(--font-display); font-size: clamp(1.4rem, 2.4vw, 1.8rem); font-weight: 600; margin: 4px 0 18px; }
.ag-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.ag-option { border: 1px solid var(--color-border); border-top: 4px solid var(--flow-badge-grey); border-radius: 12px; padding: 14px 16px; background: var(--color-surface); display: flex; flex-direction: column; gap: 8px; }
.ag-option.ag-aifa-reimbursed { border-top-color: var(--flow-badge-green); }
.ag-option.ag-aifa-not_reimbursed { border-top-color: var(--flow-badge-red); }
.ag-option.ag-aifa-standard { border-top-color: var(--color-primary); }
.ag-opt-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ag-opt-name { font-weight: 700; font-size: 1.02rem; line-height: 1.3; }
.ag-chip { flex: none; display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--flow-badge-grey); color: var(--color-text-muted); background: var(--color-surface-offset); white-space: nowrap; }
.ag-chip.ag-aifa-reimbursed { border-color: var(--flow-badge-green); color: var(--flow-criteria-text); background: var(--flow-criteria-bg); }
.ag-chip.ag-aifa-not_reimbursed { border-color: var(--flow-badge-red); color: var(--flow-badge-red); background: transparent; }
.ag-chip.ag-aifa-standard { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-soft); }
.ag-opt-key { font-size: 0.88rem; color: var(--color-text-muted); line-height: 1.5; }
.ag-option.ag-opt-off { opacity: 0.62; background: var(--color-surface-offset); border-top-color: var(--color-border); }
.ag-option.ag-opt-off .ag-regimen { display: none; }
.ag-chip.ag-chip-off { border-color: var(--color-border); color: var(--color-text-muted); background: transparent; }

const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>',

  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  arrowLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
  externalLink: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  branch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"/></svg>',
};

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

/* ---------- palette colore stabile per tema ---------- */
function themeHue(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return hash % 360;
}
function themeColor(name) {
  const h = themeHue(name);
  return `hsl(${h}, 52%, 45%)`;
}
function themeInitials(name) {
  const words = name.replace(/[-_]/g, " ").split(" ").filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}
/* piccole icone stroke-based per tema clinico, in tema con le altre icone del sito */
const THEME_ICONS = {
  "Torace": '<path d="M12 3v6"/><path d="M9 9c-2.2 0-4 2.2-4 6.2 0 3 1.1 5.8 3.1 5.8 1.3 0 2-1.3 2-3.3V9Z"/><path d="M15 9c2.2 0 4 2.2 4 6.2 0 3-1.1 5.8-3.1 5.8-1.3 0-2-1.3-2-3.3V9Z"/>',
  "Mammella": '<path d="M12 3c-1.6 2.1-1.6 5.1 0 7.2 1.6-2.1 1.6-5.1 0-7.2Z"/><path d="M12 10.2v3.3"/><path d="M8.3 21c0-3.4 1.4-6 3.7-6s3.7 2.6 3.7 6"/>',
  "Gastrointestinali": '<path d="M8 3c0 3.2-3.2 3.4-3.2 7.6a7.2 7.2 0 0 0 14.4 0c0-2.1-1-3.2-1-5.3"/><path d="M12.4 13v3.6a3.2 3.2 0 0 0 3.2 3.2h1"/>',
  "Urologici": '<path d="M8.3 4C5.3 4 3.5 7 3.5 11s1.8 9.5 4.8 9.5c1.9 0 1.9-3.1 3.7-3.1s1.8 3.1 3.7 3.1c3 0 4.8-5.5 4.8-9.5S18.7 4 15.7 4c-1.9 0-1.8 3.1-3.7 3.1S10.2 4 8.3 4Z"/>',
  "Ginecologici": '<path d="M8.5 3v5.6c0 2-1.9 2.9-3.7 2.9-2 0-3.2 3.6-1.2 5.6 2 2 4.8.9 5.9-1 .9-1.6 1.5-1.6 1.5-1.6s.6 0 1.5 1.6c1.1 1.9 3.9 3 5.9 1 2-2 .8-5.6-1.2-5.6-1.8 0-3.7-.9-3.7-2.9V3"/>',
  "Cute": '<path d="M12 3 4 7.5l8 4.5 8-4.5L12 3Z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5 12 21l8-4.5"/>',
  "Testa-Collo": '<path d="M9.5 3.2A5.8 5.8 0 0 1 15 9v1.6l2 1-2 1v.7a3 3 0 0 1-3 3h-.5v3.7H9V16a5.8 5.8 0 0 1-3-5.1V9a5.8 5.8 0 0 1 3.5-5.8Z"/>',
  "Neuro-oncologia": '<path d="M9.2 4.3A2.8 2.8 0 0 0 6.4 7a2.8 2.8 0 0 0-.9 5.3A2.8 2.8 0 0 0 8.2 16h.8v3.4h6V16h.8a2.8 2.8 0 0 0 2.7-3.7A2.8 2.8 0 0 0 17.6 7a2.8 2.8 0 0 0-2.8-2.7 2.8 2.8 0 0 0-2.8.9 2.8 2.8 0 0 0-2.8-.9Z"/>',
  "Sarcomi": '<path d="M7.3 7.3a2.3 2.3 0 1 1 3.7 1.8l5.9 5.9a2.3 2.3 0 1 1-1.8 3.7 2.3 2.3 0 0 1-3.7-1.8L5.5 11a2.3 2.3 0 0 1 1.8-3.7Z"/>',
  "Ematologia": '<path d="M12 3.2c3.1 4.1 5.8 8 5.8 10.9a5.8 5.8 0 0 1-11.6 0c0-2.9 2.7-6.8 5.8-10.9Z"/>',
  "Trasversali": '<path d="M12 3.2 19 6v5.8c0 5-3.4 7.9-7 8.9-3.6-1-7-3.9-7-8.9V6l7-2.8Z"/><path d="M12 9v6M9 12h6"/>',
  "Altro": '<circle cx="7" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="17" cy="12" r="1.5"/>',
};
function themeBadge(name, size) {
  const s = size || 24;
  const icon = THEME_ICONS[name];
  const inner = icon
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:${Math.round(s*0.56)}px;height:${Math.round(s*0.56)}px">${icon}</svg>`
    : themeInitials(name);
  return `<div class="theme-badge" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.28)}px;background:${themeColor(name)}">${inner}</div>`;
}

/* ---------- inline markdown formatting ---------- */
function inlineFormat(text) {
  let out = escapeHtml(text);
  // Popup "schema di terapia": {{testo visibile::dettaglio (cicli, cadenza, durata)}} — funziona anche
  // dentro le celle di tabella, dato che qui operiamo prima di link/grassetto/evidenziatori.
  out = out.replace(/\{\{([^{}]+?)::([^{}]+)\}\}/g, (m, label, detail) => `<span class="tt-trig" tabindex="0" data-tip="${detail.trim()}">${label.trim()}</span>`);
  out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" loading="lazy">');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, (m, t) => isTrialName(t) ? `<strong class="trial">${t}</strong>` : `<strong>${t}</strong>`);
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Highlight marks: ==testo== (evidenza standard), ++testo++ (novità/aggiornamento), !!testo!! (attenzione)
  out = out.replace(/==((?:[^=\n]|=(?!=))+?)==/g, '<mark class="hl hl-primary">$1</mark>');
  out = out.replace(/\+\+((?:[^+\n]|\+(?!\+))+?)\+\+/g, '<mark class="hl hl-accent">$1</mark>');
  out = out.replace(/!!((?:[^!\n]|!(?!!))+?)!!/g, '<mark class="hl hl-warn">$1</mark>');
  return out;
}

function slugify(text) {
  return text.toLowerCase().trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, "-");
}

// Sezioni finali mostrate come schede di riepilogo (titolo "## ..." → classe della sezione).
const SUMMARY_SECTIONS = { "Punti chiave": "sum-key", "Errori da evitare": "sum-err" };
const CALLOUT_KIND = { "hl-accent": "co-update", "hl-warn": "co-warn", "hl-primary": "co-info" };

/* ---------- riconoscimento dei trial e note grafiche a margine ---------- */
// Un grassetto è un trial se ha la forma di un acronimo di studio (KEYNOTE-054, CheckMate 067, IMpower133,
// NADINA…) e la prima parola non è un biomarcatore, una scala o un'istituzione.
const TRIAL_STOP = new Set(("BRCA MEN FGFR TTF PIK STK WHO FIGO CTNNB NCI CDH DOG CCND ESR ISRT HER KRAS NRAS BRAF EGFR ALK ROS MET " +
  "NTRK RET IDH HLA ECOG TNM AJCC UICC ISUP AUC TPS CPS IPI BCLC ORR RFS EFS DFS PFS MCBS ESMO AIOM ASCO NCCN FDA EMA " +
  "AIFA SSN CTCAE MSI TMB ESCAT MMR POLE ARID CDKN PTEN ATM KIT FLT NPM JAK CYP UGT DPYD NGS LDH CEA PSA AFP HCG PET SUV " +
  "SBRT IMRT VMAT TACE TARE HIPEC RFA POD Legge Deauville Maltoni NIFTP FOLFIRINOX NALIRIFOX FOLFOX FOLFIRI XELOX CAPOX " +
  "DLBCL SIADH LCNEC AMERK NLPHL HSTCL ENKTCL GCNIS IGCCCG IPFSG KELIM RECIST PDGFRA SEMPRE NESSUN NESSUNA NESSUNO TUTTI " +
  "TUTTE FAMMM ENTRAMBI OBBLIGATORIO OBBLIGATORIA CONTROINDICATI CONTROINDICATO REVOCATA NEGATIVO POSITIVO SOLO").split(" "));
function isTrialName(t) {
  t = t.trim();
  if (t.length < 4 || t.length > 42) return false;
  if (/^[A-Z]{5,}$/.test(t)) return !TRIAL_STOP.has(t);
  if (!/^[A-Z][A-Za-z0-9]*(?:[- /][A-Z0-9][A-Za-z0-9]*){0,4}$/.test(t) || !/\d/.test(t)) return false;
  const head = t.match(/^[A-Za-z]+/)[0];
  return head.length >= 3 && /[A-Z].*[A-Z]|^[A-Z][a-z]+[A-Z]/.test(head) && !TRIAL_STOP.has(head);
}
const SETTING_LABELS = [
  [/prima linea|\b1L\b|1ª linea/i, "1ª linea"], [/seconda linea|\b2L\b|2ª linea/i, "2ª linea"],
  [/terza linea|\b3L\b|linee successive/i, "linee successive"], [/perioperatori/i, "perioperatorio"],
  [/neoadiuvant/i, "neoadiuvante"], [/adiuvant/i, "adiuvante"], [/mantenimento/i, "mantenimento"],
];
// Classifica un paragrafo (testo markdown grezzo) e restituisce al massimo tre note.
function marginNotes(raw) {
  const text = raw.replace(/\{\{([^{}]+?)::[^{}]+\}\}/g, "$1");
  const notes = [];
  const years = (text.match(/\b202[4-9]\b/g) || []).map(Number);
  const lastYear = years.length ? Math.max(...years) : null;
  const trials = [...new Set([...text.matchAll(/\*\*([^*]+)\*\*/g)].map(m => m[1].trim()).filter(isTrialName))];
  const negStd = /non (è|rappresenta|costituisce|sono|resta|diventa) (ancora )?(uno |lo |il |un )?(nuovo )?standard|non standard|non ancora (uno )?standard/i.test(text);
  if (!negStd && /nuovo standard/i.test(text)) {
    const set = SETTING_LABELS.find(([re]) => re.test(text));
    notes.push({ kind: "mn-new", label: "Nuovo standard", detail: set ? set[1] : "" });
  } else if (!negStd && /(è|resta|rimane|diventa|rappresenta|costituisce) (oggi |quindi |ancora )?(lo |il |uno )?standard|\b(lo|il) standard (è|resta|rimane)|standard (di cura|of care|terapeutico|attuale)|trattamento standard|opzione standard/i.test(text)) {
    const set = SETTING_LABELS.find(([re]) => re.test(text));
    // se il paragrafo si apre con un sottogruppo in grassetto (es. "**HER2-positivo**: ...") lo usa come dettaglio
    const lead = text.match(/^\*\*([^*]{2,40})\*\*\s*[:(]/);
    const detail = lead && !isTrialName(lead[1]) ? lead[1] : (set ? set[1] : "");
    notes.push({ kind: "mn-standard", label: "Standard di cura", detail });
  }
  if (trials.length && (lastYear >= 2025 || /fase (III|3)|phase (III|3)|randomizzat|registrativ|pivotal|pratica-modificant|confermator/i.test(text))) {
    notes.push({ kind: "mn-trial", label: lastYear >= 2025 ? "Trial recente" : "Trial chiave", detail: trials.slice(0, 2).join(" · ") });
  }
  if (lastYear >= 2025 && /\bAIFA\b|\bSSN\b|648/.test(text) && /rimbors|determina|648|C\s?\(nn\)|Gazzetta/i.test(text)) {
    const neg = /non (è |risulta |sono |è stat[oa] )?(ancora )?(rimborsat|rimborsabil)|nessuna determina|non ancora (pubblicat|determinat|negoziat)|in attesa d(i|ella) (determina|rimbors|negoziaz)|gap|C\s?\(nn\)/i.test(text);
    const pos = /(è|sono|viene|risulta) (ora |oggi |già )?rimborsat|rimborsabilità (piena|SSN|AIFA)|rimborsa |ha ribaltato|ottenuto (la )?rimborsabilità|legge 648|648\/96|==rimborsato/i.test(text);
    const detail = /648/.test(text) ? `Legge 648/96 · ${lastYear}` : String(lastYear);
    if (neg && !pos) notes.push({ kind: "mn-gap", label: "Gap AIFA", detail });
    else notes.push({ kind: "mn-aifa", label: pos && !neg ? "Rimborso AIFA" : "Novità AIFA", detail });
  }
  return notes.slice(0, 3);
}
function notesHtml(raw) {
  const notes = marginNotes(raw);
  if (!notes.length) return "";
  return `<div class="mnotes">${notes.map(n => `<span class="mnote ${n.kind}"><span class="mnote-label">${n.label}</span>${n.detail ? `<span class="mnote-detail">${escapeHtml(n.detail)}</span>` : ""}</span>`).join("")}</div>`;
}
const withNotes = (raw, html) => { const n = notesHtml(raw); return n ? `<div class="np">${html}${n}</div>` : html; };

// Evita che note di paragrafi vicini si sovrappongano nella colonna a margine.
function layoutMarginNotes(root) {
  let lastBottom = -Infinity;
  root.querySelectorAll(".mnotes").forEach(el => {
    el.style.transform = "";
    if (getComputedStyle(el).position !== "absolute") return;
    const r = el.getBoundingClientRect();
    const shift = Math.max(0, lastBottom + 10 - r.top);
    if (shift) el.style.transform = `translateY(${shift}px)`;
    lastBottom = r.bottom + shift;
  });
}
function watchMarginNotes(root) {
  let raf = 0;
  const run = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => layoutMarginNotes(root)); };
  new ResizeObserver(run).observe(root);
  document.fonts?.ready.then(run);
  run();
}

// Tabelle più larghe della colonna: pulsante "Espandi" che le apre a schermo intero.
function initTableExpand(root, title) {
  root.querySelectorAll(".table-wrap").forEach(wrap => {
    const block = document.createElement("div");
    block.className = "table-block";
    wrap.replaceWith(block);
    block.appendChild(wrap);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "table-expand";
    btn.textContent = "⤢ Espandi tabella";
    btn.addEventListener("click", () => openTableOverlay(wrap, title));
    const cols = wrap.querySelectorAll("thead th").length;
    const check = () => { btn.hidden = cols < 4 && wrap.scrollWidth <= wrap.clientWidth + 2; };
    block.insertBefore(btn, wrap);
    new ResizeObserver(check).observe(wrap);
    check();
  });
}
function openTableOverlay(wrap, title) {
  const ov = document.createElement("div");
  ov.className = "table-overlay";
  ov.innerHTML = `<div class="table-overlay-bar"><div class="table-overlay-title"></div><button type="button" class="table-expand">✕ Chiudi</button></div>`;
  ov.querySelector(".table-overlay-title").textContent = title;
  const clone = wrap.cloneNode(true);
  ov.appendChild(clone);
  if (typeof initTooltips === "function") initTooltips(clone);
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  ov.querySelector("button").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov);
}

/* ---------- popup "schema di terapia" (sintassi {{label::dettaglio}}, vedi inlineFormat) ---------- */
let ttGlobalBound = false;
function ensureTooltipPortal() {
  let portal = document.getElementById("tt-portal");
  if (!portal) {
    portal = document.createElement("div");
    portal.id = "tt-portal";
    portal.setAttribute("role", "tooltip");
    document.body.appendChild(portal);
  }
  return portal;
}
function initTooltips(container) {
  const portal = ensureTooltipPortal();
  const hide = () => { portal.classList.remove("tt-visible"); portal.dataset.owner = ""; };
  const show = (el) => {
    portal.innerHTML = `<span class="tt-portal-label">Schema di terapia</span>${el.dataset.tip}`;
    portal.dataset.owner = el.dataset.ttId;
    portal.classList.add("tt-visible");
    const rect = el.getBoundingClientRect();
    const pw = portal.offsetWidth, ph = portal.offsetHeight;
    let left = rect.left + rect.width / 2 - pw / 2;
    left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));
    let top = rect.top - ph - 10;
    if (top < 8) top = rect.bottom + 10; // ribalta sotto se non c'è spazio sopra (es. prima riga di tabella)
    portal.style.left = `${left}px`;
    portal.style.top = `${top}px`;
  };
  // dispositivi con vero hover (mouse) usano solo mouseenter/mouseleave; sul touch, dove il tap genera
  // comunque un mouseenter sintetico appena prima del click, un click-toggle in più farebbe aprire e
  // richiudere il popup nello stesso gesto — quindi lì il tap è l'UNICO trigger, senza hover.
  const hasHover = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  container.querySelectorAll(".tt-trig").forEach((el, i) => {
    el.dataset.ttId = `tt-${i}`;
    if (hasHover) {
      el.addEventListener("mouseenter", () => show(el));
      el.addEventListener("mouseleave", hide);
    } else {
      el.addEventListener("click", (ev) => {
        ev.preventDefault();
        if (portal.classList.contains("tt-visible") && portal.dataset.owner === el.dataset.ttId) { hide(); return; }
        show(el);
      });
    }
    el.addEventListener("focus", () => show(el));
    el.addEventListener("blur", hide);
  });
  // legati una volta sola a livello globale: chiude il popup toccando altrove (utile su touch) o scrollando
  if (!ttGlobalBound) {
    ttGlobalBound = true;
    document.addEventListener("click", (ev) => {
      if (!ev.target.closest(".tt-trig") && !ev.target.closest("#tt-portal")) hide();
    }, true);
    window.addEventListener("scroll", hide, true);
  }
}

function markdownToHtml(md) {
  const lines = md.split(/\r?\n/);
  let html = "", inList = false, inOrderedList = false, inCode = false, codeBuf = [], codeLang = "";
  let tableBuf = [];
  const toc = [];
  const slugCount = {};
  // la prima riga "# Titolo" duplica l'h1 già mostrato nell'intestazione della scheda: si salta.
  let sawTitle = false;
  const append = (str) => { html += str; };
  const closeList = () => { if (inList) { append("</ul>"); inList = false; } if (inOrderedList) { append("</ol>"); inOrderedList = false; } };
  // Righe "> ..." consecutive formano un solo riquadro; una riga ">" vuota separa i paragrafi.
  // Se il riquadro si apre con un'evidenziazione che termina con ":" (es. "++Verifica in letteratura:++"),
  // quell'etichetta diventa l'intestazione del riquadro e il suo colore ne decide il tipo.
  let quoteBuf = [];
  const flushQuote = () => {
    if (!quoteBuf.length) return;
    const rawAll = quoteBuf.join("\n");
    const paras = rawAll.split(/\n\s*\n/).map(t => t.trim()).filter(Boolean).map(t => inlineFormat(t.replace(/\n/g, " ")));
    quoteBuf = [];
    const rawQuote = rawAll;
    const m = paras[0] && paras[0].match(/^<mark class="hl (hl-\w+)">([^<]*?):\s*<\/mark>\s*/);
    if (!m) { append(withNotes(rawQuote, `<blockquote>${paras.map(t => `<p>${t}</p>`).join("")}</blockquote>`)); return; }
    paras[0] = paras[0].slice(m[0].length);
    const body = paras.filter(Boolean).map(t => `<p>${t}</p>`).join("");
    append(withNotes(rawQuote, `<aside class="callout ${CALLOUT_KIND[m[1]] || "co-info"}"><div class="callout-label">${m[2]}</div>${body}</aside>`));
  };
  // "## Punti chiave" / "## Errori da evitare" aprono una scheda di riepilogo chiusa alla sezione successiva.
  let inSummary = false;
  const closeSummary = () => { if (inSummary) { closeList(); append("</section>"); inSummary = false; } };
  const isTableRow = (l) => l.startsWith("|") && l.endsWith("|");
  const isTableSep = (l) => /^\|?[\s:|-]+\|?$/.test(l) && l.includes("-");
  const flushTable = () => {
    if (!tableBuf.length) return;
    const rows = tableBuf.map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    const header = rows[0];
    const body = rows.slice(1).filter(r => !(r.length === header.length && r.every(c => /^:?-+:?$/.test(c))));
    append('<div class="table-wrap"><table><thead><tr>' +
      header.map(c => `<th>${inlineFormat(c)}</th>`).join("") +
      '</tr></thead><tbody>' +
      body.map(r => `<tr>${r.map(c => `<td>${inlineFormat(c)}</td>`).join("")}</tr>`).join("") +
      '</tbody></table></div>');
    tableBuf = [];
  };
  const makeSlug = (text) => {
    let base = slugify(text) || "sezione";
    slugCount[base] = (slugCount[base] || 0) + 1;
    return slugCount[base] > 1 ? `${base}-${slugCount[base]}` : base;
  };

  for (let raw of lines) {
    const line = raw.trim();

    if (line.startsWith("```")) {
      if (inCode) {
        if (codeLang === "mermaid") {
          const src = codeBuf.join("\n");
          append(`<div class="mermaid-card"><div class="mermaid">${escapeHtml(src)}</div></div>`);
        } else if (codeLang === "button") {
          const btnLines = codeBuf.join("\n").trim().split("\n").map(s => s.trim()).filter(Boolean);
          const btnLabel = btnLines[0] || "Apri";
          const btnUrl = btnLines[1] || "#";
          append(`<a class="scheda-btn" href="${escapeHtml(btnUrl)}" target="_blank" rel="noopener">${inlineFormat(btnLabel)}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></a>`);
        } else {
          append(`<pre><code>${escapeHtml(codeBuf.join("\n"))}</code></pre>`);
        }
        codeBuf = [];
        inCode = false;
        codeLang = "";
      } else {
        closeList(); flushTable(); flushQuote();
        inCode = true;
        codeLang = line.slice(3).trim().toLowerCase();
      }
      continue;
    }
    if (inCode) { codeBuf.push(raw); continue; }

    if (line === ">" || line.startsWith("> ")) { closeList(); flushTable(); quoteBuf.push(line.slice(2)); continue; }
    flushQuote();

    if (isTableRow(line)) {
      if (tableBuf.length === 1 && isTableSep(line)) { tableBuf.push(line); continue; }
      tableBuf.push(line);
      continue;
    } else if (tableBuf.length) {
      flushTable();
    }

    if (!line) { closeList(); continue; }
    if (line.startsWith("#### ")){
      closeList(); append(`<h4>${inlineFormat(line.slice(5).trim())}</h4>`); continue;
    }
    if (line.startsWith("### ")) { closeList(); append(`<h3>${inlineFormat(line.slice(4))}</h3>`); continue; }
    if (line.startsWith("## "))  {
      closeSummary(); closeList();
      const text = line.slice(3).trim();
      const id = makeSlug(text);
      toc.push({ id, text, level: 2 });
      const kind = SUMMARY_SECTIONS[text];
      if (kind) {
        append(`<section class="summary-card ${kind}"><h2 id="${id}">${inlineFormat(text)}</h2>`);
        inSummary = true;
      } else {
        append(`<h2 id="${id}">${inlineFormat(text)}</h2>`);
      }
      continue;
    }
    if (line.startsWith("# ")) {
      closeSummary(); closeList();
      if (!sawTitle && !html) { sawTitle = true; continue; }
      append(`<h1>${inlineFormat(line.slice(2))}</h1>`);
      continue;
    }
    if (/^-\s|^\*\s/.test(line)) {
      if (!inList) { append("<ul>"); inList = true; }
      append(`<li>${inlineFormat(line.replace(/^[-*]\s/, ""))}</li>`);
      continue;
    }
    if (/^\d+\.\s/.test(line)) {
      if (!inOrderedList) { append("<ol>"); inOrderedList = true; }
      append(`<li>${inlineFormat(line.replace(/^\d+\.\s/, ""))}</li>`);
      continue;
    }
    if (line === "---" || line === "***") { closeList(); append("<hr>"); continue; }
    closeList();
    append(inSummary ? `<p>${inlineFormat(line)}</p>` : withNotes(line, `<p>${inlineFormat(line)}</p>`));
  }
  flushQuote();
  closeList();
  flushTable();
  closeSummary();
  if (inCode && codeBuf.length) {
    if (codeLang === "mermaid") {
      append(`<div class="mermaid-card"><div class="mermaid">${escapeHtml(codeBuf.join("\n"))}</div></div>`);
    } else {
      append(`<pre><code>${escapeHtml(codeBuf.join("\n"))}</code></pre>`);
    }
  }
  return { html, toc };
}

/* ---------- mermaid flowcharts ---------- */
const mdCache = {};
function mermaidThemeVariables(mode) {
  const light = {
    darkMode: false,
    background: "#fbfaf6",
    primaryColor: "#eaf5f3",
    primaryTextColor: "#241f18",
    primaryBorderColor: "#0f6f68",
    lineColor: "#a39b8a",
    secondaryColor: "#f6e3d4",
    secondaryBorderColor: "#c4622d",
    tertiaryColor: "#efeae1",
    tertiaryBorderColor: "#ddd6ca",
    clusterBkg: "#f6f3ec",
    clusterBorder: "#ddd6ca",
    edgeLabelBackground: "#fbfaf6",
    fontFamily: "'General Sans', -apple-system, sans-serif",
    fontSize: "13.5px",
    nodeTextColor: "#241f18",
  };
  const dark = {
    darkMode: true,
    background: "#1a1814",
    primaryColor: "#1e3733",
    primaryTextColor: "#ede8dc",
    primaryBorderColor: "#52b6ab",
    lineColor: "#8a8172",
    secondaryColor: "#3a2a1c",
    secondaryBorderColor: "#e08a52",
    tertiaryColor: "#24211b",
    tertiaryBorderColor: "#343026",
    clusterBkg: "#14120f",
    clusterBorder: "#343026",
    edgeLabelBackground: "#1a1814",
    fontFamily: "'General Sans', -apple-system, sans-serif",
    fontSize: "13.5px",
    nodeTextColor: "#ede8dc",
  };
  return mode === "dark" ? dark : light;
}
function initMermaid() {
  if (typeof mermaid === "undefined") return;
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "loose",
    theme: "base",
    themeVariables: mermaidThemeVariables(state.themeMode),
    flowchart: { curve: "basis", htmlLabels: true, padding: 14 },
  });
}
async function renderMermaid() {
  if (typeof mermaid === "undefined") return;
  const nodes = document.querySelectorAll(".mermaid");
  if (!nodes.length) return;
  try {
    await mermaid.run({ nodes: Array.from(nodes) });
  } catch (e) {
    console.warn("Mermaid render error:", e);
  }
}

const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function initTheme() {
  const root = document.documentElement;
  const saved = localStorage.getItem('onco-theme');
  state.themeMode = saved || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  root.setAttribute('data-theme', state.themeMode);
  const btn = document.getElementById('themeToggle');
  btn.innerHTML = state.themeMode === 'dark' ? sunIcon : moonIcon;
  btn.addEventListener('click', () => {
    state.themeMode = state.themeMode === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', state.themeMode);
    localStorage.setItem('onco-theme', state.themeMode);
    btn.innerHTML = state.themeMode === 'dark' ? sunIcon : moonIcon;
    initMermaid();
    if (state.view === 'scheda' && state.activeItem) openScheda(state.activeItem);
  });
}

function applySidebarCollapse() {
  const isDesktop = window.innerWidth > 900;
  document.querySelector('.app').classList.toggle('sidebar-collapsed', isDesktop && state.sidebarCollapsed);
  document.querySelector('.sidebar').classList.toggle('collapsed', isDesktop && state.sidebarCollapsed);

function closeMobileNav() {

async function loadData() {
  try {
    const res = await fetch("../data/study-index.json?t=" + Date.now());
    const json = await res.json();
    state.generated_at = json.generated_at || "";
    state.counts = json.counts || {};
    state.themes = json.themes || {};
    state.items = json.items || [];
    state.algorithms = json.algorithms || [];
    renderAlgorithmsNav();
    Object.keys(state.themes).forEach(t => state.openThemes.add(t));
    renderStatPills();
    renderThemeNav();
    renderView();
    renderFooter();
  } catch (e) {
    document.getElementById("content").innerHTML = emptyState(
      ICONS.inbox,
      "Impossibile leggere data/study-index.json",
      "Controlla che il server locale sia attivo e che lo script Python sia stato eseguito."
    );
  }
}

}
function schedeOfTheme(theme) {
  return themedItems(theme).filter(i => i.extension === ".md");
}

function renderThemeNav() {
  const box = document.getElementById("themeNav");
  const themeNames = Object.keys(state.themes).sort((a,b) => a.localeCompare(b));

  box.innerHTML = themeNames.map(theme => {
    const schede = schedeOfTheme(theme);
    const isOpen = state.openThemes.has(theme);
    const isActiveTheme = state.activeTheme === theme;
    const schedaLinks = schede.map(s => `
      <div class="scheda-link ${state.activeItem && state.activeItem.relative_path === s.relative_path ? 'active' : ''}" data-path="${escapeHtml(s.relative_path)}">
        <span>${escapeHtml(s.title)}</span>
      </div>
    `).join("");

    return `
      <div class="theme-group">
        <div class="theme-header ${isOpen ? 'open' : ''} ${isActiveTheme ? 'active-theme' : ''}" data-theme-toggle="${escapeHtml(theme)}">
          ${themeBadge(theme)}
          <span class="th-name">${escapeHtml(theme)}</span>
          <span class="count">${schede.length}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="scheda-list ${isOpen ? 'open' : ''}">
          ${schedaLinks || '<div class="scheda-link" style="opacity:.6;cursor:default;">Nessuna scheda</div>'}
        </div>
      </div>
    `;
  }).join("");

  box.querySelectorAll("[data-theme-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const theme = el.dataset.themeToggle;
      if (state.openThemes.has(theme)) state.openThemes.delete(theme);
      else state.openThemes.add(theme);
      goToTheme(theme);
    });
  });

  box.querySelectorAll("[data-path]").forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const path = el.dataset.path;
      const item = state.items.find(i => i.relative_path === path);
      if (item) openScheda(item);
    });
  });
}

function goToTheme(theme) {
  state.view = "theme";
  state.activeTheme = theme;
  state.activeItem = null;
  state.sidebarCollapsed = false;
  applySidebarCollapse();
  closeMobileNav();
  setReaderMode(false);
  document.getElementById("navHome").classList.remove("active");
  renderThemeNav();
  renderView();
}

function goHome() {
  state.view = "home";
  state.activeTheme = null;
  state.activeItem = null;

  applySidebarCollapse();

  renderThemeNav();

}

function updateReadingProgress() {
  const bar = document.getElementById("readingProgress");
  const article = document.querySelector(".md-content");
  if (!article) { bar.style.width = "0%"; return; }
  const rect = article.getBoundingClientRect();
  const total = rect.height - window.innerHeight + 200;
  const scrolled = Math.min(Math.max(-rect.top, 0), total);
  bar.style.width = total > 0 ? `${(scrolled / total) * 100}%` : "0%";
}

function setupTocObserver() {
  const headers = document.querySelectorAll(".md-content h2[id]");
  const links = document.querySelectorAll(".toc-list a");
  if (!headers.length || !links.length) return;
  const onScroll = () => {
    let currentId = headers[0].id;
    headers.forEach(h => { if (h.getBoundingClientRect().top < 140) currentId = h.id; });
    links.forEach(l => l.classList.toggle("active", l.dataset.target === currentId));
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}

function readerNav(item) {
  const schede = schedeOfTheme(item.theme).sort((a,b) => a.title.localeCompare(b.title));
  const idx = schede.findIndex(s => s.relative_path === item.relative_path);
  const prev = idx > 0 ? schede[idx - 1] : null;
  const next = idx < schede.length - 1 ? schede[idx + 1] : null;
  return { prev, next };
}

async function openScheda(item) {
  const wasScheda = state.view === "scheda";
  state.view = "scheda";
  state.activeTheme = item.theme;
  state.activeItem = item;
  updateNavActive();
  if (!wasScheda) {
    state.sidebarCollapsed = true;
    applySidebarCollapse();
  }
  closeMobileNav();
  setReaderMode(true);
  renderThemeNav();

  const content = document.getElementById("content");
  content.innerHTML = emptyState(ICONS.clock, "Caricamento scheda...", "");
  document.getElementById("crumbs").innerHTML = `<strong>${escapeHtml(item.theme)}</strong><span class="sep">/</span>${escapeHtml(item.title)}`;

  try {
    let text = mdCache[item.relative_path];
    if (text === undefined) {
      const res = await fetch("../" + item.relative_path + "?t=" + Date.now());
      text = await res.text();
      mdCache[item.relative_path] = text;
    }
    const { html, toc } = markdownToHtml(text);
    const related = themedItems(item.theme).filter(i => i.extension !== ".md");
    const { prev, next } = readerNav(item);
    const algo = algorithmForScheda(item.relative_path);
    const kpEntry = toc.find(t => t.text === "Punti chiave");

    content.innerHTML = `
      <div class="reader-layout">
        <div class="reader-wrap">
          <div class="reader-head">
            <div class="badge-theme">${themeBadge(item.theme, 16)} ${escapeHtml(item.theme)}</div>
            <h1>${escapeHtml(item.title)}</h1>
            <div class="reader-meta-row">
              <span>${ICONS.calendar} aggiornata ${escapeHtml((item.modified || "").slice(0,10))}</span>
              <span>${ICONS.clock} ${item.reading_time_min || 1} min di lettura</span>
            </div>
            ${(algo || kpEntry) ? `<div class="reader-actions">
              ${kpEntry ? `<button type="button" class="kp-jump" data-jump="${kpEntry.id}">Punti chiave</button>` : ""}
              ${algo ? `<button type="button" class="ag-open-btn" data-open-algo="${escapeHtml(algo.id)}">${ICONS.branch} Apri algoritmo</button>` : ""}
            </div>` : ""}
          </div>
          <div class="md-content">${html}</div>
          ${
            (prev || next) ? `
            <div class="reader-nav">
              ${prev ? `<button class="reader-nav-btn prev" data-nav="${escapeHtml(prev.relative_path)}"><span class="rn-label">${ICONS.arrowLeft} precedente</span><span class="rn-title">${escapeHtml(prev.title)}</span></button>` : '<span></span>'}
              ${next ? `<button class="reader-nav-btn next" data-nav="${escapeHtml(next.relative_path)}"><span class="rn-label">successiva ${ICONS.arrowRight}</span><span class="rn-title">${escapeHtml(next.title)}</span></button>` : ''}
            </div>` : ''
          }
          ${
            related.length ? `
            <div class="related-box">
              <div class="section-title">Fonti collegate a questo tema</div>
              <div class="related-grid">
                ${related.map(r => `
                  <div class="related-card">
                    <div class="rc-cat">${escapeHtml(r.category)}</div>
                    <div class="rc-title">${escapeHtml(r.title)}</div>
                    <a href="../${encodeURI(r.relative_path)}" target="_blank">Apri PDF ${ICONS.externalLink}</a>
                  </div>
                `).join("")}
              </div>
            </div>` : ''
          }
        </div>
        ${toc.length ? `
        <aside class="toc">
          <div class="toc-title">In questa scheda</div>
          <div class="toc-list">
            ${toc.map(t => `<a href="#${t.id}" data-target="${t.id}">${escapeHtml(t.text)}</a>`).join("")}
          </div>
        </aside>` : '<aside></aside>'}
      </div>
    `;

    content.querySelectorAll("[data-nav]").forEach(el => {
      el.addEventListener("click", () => {
        const it = state.items.find(i => i.relative_path === el.dataset.nav);
        if (it) { openScheda(it); window.scrollTo(0,0); }
      });
    });
    content.querySelectorAll(".toc-list a").forEach(el => {
      el.addEventListener("click", (ev) => {
        ev.preventDefault();
        document.getElementById(el.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    content.querySelector("[data-open-algo]")?.addEventListener("click", () => openAlgorithm(algo.id));
    content.querySelector("[data-jump]")?.addEventListener("click", (ev) => {
      document.getElementById(ev.currentTarget.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const article = content.querySelector(".md-content");
    initTableExpand(article, item.title);
    watchMarginNotes(article);
    setupTocObserver();
    initMermaid();
    renderMermaid();
    initTooltips(content);
    window.scrollTo(0,0);
  } catch (e) {
    content.innerHTML = emptyState(ICONS.inbox, "Non sono riuscito a leggere questa scheda", "Verifica che il file Markdown esista nel percorso indicato.");
  }
}

const algoCache = {};

function renderAlgorithmsNav() {
  document.getElementById("navAlgorithms").hidden = state.algorithms.length === 0;
  document.getElementById("navAlgorithmsCount").textContent = state.algorithms.length;
}

function updateNavActive() {
  const inAlgorithms = state.view === "algorithms" || state.view === "algorithm";

function algorithmForScheda(relPath) {
  return state.algorithms.find(a => a.scheda === relPath) || null;
}

function leaveForAlgorithms(view) {
  state.view = view;
  state.activeTheme = null;

  renderThemeNav();

function goToAlgorithms() {
  leaveForAlgorithms("algorithms");
  renderAlgorithmsList();
  window.scrollTo(0, 0);
}

async function openAlgorithm(id) {
  leaveForAlgorithms("algorithm");
  const summary = state.algorithms.find(a => a.id === id);
  state.activeAlgorithm = null;
  state.requestedAlgorithm = id;
  state.algoHistory = [];
  const content = document.getElementById("content");
  document.getElementById("crumbs").innerHTML = `<strong>Algoritmi</strong><span class="sep">/</span>${escapeHtml(summary ? summary.title : id)}`;
  if (!summary) {
    content.innerHTML = emptyState(ICONS.inbox, "Algoritmo non trovato", escapeHtml(id));
    return;
  }
  content.innerHTML = emptyState(ICONS.clock, "Caricamento algoritmo...", "");
  try {
    let data = algoCache[summary.path];
    if (!data) {
      const res = await fetch("../" + encodeURI(summary.path) + "?t=" + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
      algoCache[summary.path] = data;
    }
    // l'utente potrebbe aver cambiato vista mentre il file si caricava
    if (state.view !== "algorithm" || state.requestedAlgorithm !== id) return;
    state.activeAlgorithm = { summary, data };
    renderAlgorithm();
    window.scrollTo(0, 0);
  } catch (e) {
    if (state.view !== "algorithm" || state.requestedAlgorithm !== id) return;
    content.innerHTML = emptyState(ICONS.inbox, `Impossibile caricare l'algoritmo «${escapeHtml(summary.title)}»`, escapeHtml(summary.path));
  }
}

function agRegimenHtml(reg) {

function agSequenceHtml(seq) {
  if (!seq.done.length && !seq.current) return "";
  const arrow = `<div class="ag-seq-arrow" aria-hidden="true">${ICONS.arrowRight}</div>`;
  const steps = [
    ...seq.done.map(d => `<button type="button" class="ag-seq-step is-done" data-rewind="${d.index}" title="Torna a questa linea"><small>✓ ${d.chosen ? "Effettuata" : "Superata"}</small><strong>${escapeHtml(d.title)}</strong>${d.chosen ? `<span class="ag-seq-chosen">${escapeHtml(d.chosen)}</span>` : ""}</button>`),
    ...(seq.current ? [`<div class="ag-seq-step is-current" aria-current="step"><small>Sei qui</small><strong>${escapeHtml(seq.current.title)}</strong></div>`] : []),
    ...seq.upcoming.map(level => `<div class="ag-seq-step is-next"><small>${level.length > 1 ? "Possibile · a seconda del caso" : "Possibile"}</small>${level.map(t => `<strong>${escapeHtml(t)}</strong>`).join('<span class="ag-seq-or">oppure</span>')}</div>`),
  ];
  return `<nav class="ag-seq" aria-label="Sequenza terapeutica"><div class="ag-seq-title">Sequenza<br>terapeutica</div>${steps.join(arrow)}</nav>`;
}

function agTrailHtml(data, history, node) {
  const steps = AlgoCore.trail(data, history);
  const now = node.type === "question" ? (node.short || node.text) : node.title;
